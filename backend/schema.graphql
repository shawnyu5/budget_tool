"""
Root of the query
"""
type QueryRoot {
	"""
	Configuration for the frontend to consume
	"""
	config: FrontendConfig!
	"""
	Get the budget for a specific month in a year
	
	* `year`: the year
	* `month`: the month
	"""
	monthlyBudget(year: Int!, month: Month!): MonthlyBudgetResponse!
	monthlyBudgetConfig(year: Int!, month: Month!): MonthlyBudgetConfigResponse!
	"""
	Get the settings for a particular month. Retrieves the data from PostgresDB
	"""
	monthSettingsV2(year: Int!, month: Month!): MonthlySettingsResponse!
	me: User!
	"""
	Retrieve information from Firefly it self
	"""
	firefly: FireflySuccessResponse!
	"""
	Search for a spending item by time and ID
	"""
	searchSpendingItem(inputs: SearchSpendingItemInput!): SpendingItem
	"""
	Get data to display on the home page
	"""
	homePageV2(inputs: HomePageV2Input!): HomePage!
	"""
	Search for a transaction from the PostgresDB
	"""
	searchTransactionV2(inputs: SearchTransactionV2Inputs!): SearchTransactionV2Response!
}

input SearchSpendingItemInput {
	year: Int!
	month: Month!
	id: String!
}

