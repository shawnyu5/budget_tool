enum Month {
	January
	February
	March
	April
	May
	June
	July
	August
	September
	October
	November
	December
}

"""
Budget details for single month
"""
type MonthlyBudget {
	"""
	The month
	"""
	month: Month!
	"""
	Budget details
	"""
	budget: BudgetConfig!
	"""
	Total spending for the month. Including any over budget amount
	"""
	totalSpending: Float!
	"""
	Amount over budget for the month. 0 means not over budget.
	"""
	overBudgetAmount: Float!
	"""
	List of spent items
	"""
	spending: [SpendingItem!]!
	"""
	The month it was carried over from
	If the setting are not carried over from a previous month, this value will be empty
	"""
	carriedOverFrom: Month
}

union MonthlyBudgetConfigResponse = BudgetConfig | GraphQLErrorObject

"""
Budget details for single month
"""
input MonthlyBudgetInput {
	"""
	The month
	"""
	month: Month!
	"""
	Budget details
	"""
	budget: BudgetConfigInput!
	"""
	Total spending for the month. Including any over budget amount
	"""
	totalSpending: Float!
	"""
	Amount over budget for the month. 0 means not over budget.
	"""
	overBudgetAmount: Float!
	"""
	List of spent items
	"""
	spending: [SpendingItemInput!]!
	"""
	The month it was carried over from
	If the setting are not carried over from a previous month, this value will be empty
	"""
	carriedOverFrom: Month
}

union MonthlyBudgetResponse = MonthlyBudget | GraphQLErrorObject

type MonthlySettingsResponse {
	settings: Settings!
}

type MutationRoot {
	"""
	Save a notification subscription for a user
	The user is extracted from the JWT
	"""
	saveSubscription(subscription: SubscriptionInput!): User! @deprecated(reason: "Save to the PostgresDB instead")
	"""
	Update the budget configuration for a specific month
	"""
	updateMonthlyBudgetConfig(inputs: UpdateBudgetConfigInput!): UpdateBudgetConfigResponse! @deprecated(reason: "use `update_month_settings_v2` to save to the PostgresDB")
	"""
	Update the settings for a specific month, in the Postgres DB
	"""
	updateMonthSettingsV2(inputs: UpdateMonthSettingsInput!): UpdateMonthSettingsResponse!
	"""
	Add a spending item to a month
	"""
	addSpendingItemByMonth(inputs: AddSpendingItemByMonthInput!): AddSpendingItemByMonthResponse! @deprecated(reason: "use `add_transaction_v2` to save to the PostgresDB")
	"""
	Delete a spending item by ID. If the item doesnt exist, this handler will not do anything
	"""
	deleteSpendingItemById(inputs: DeleteSpendingItemByIdInput!): MonthlyBudgetResponse! @deprecated(reason: "use `delete_transaction_by_id_v2` to delete from the PostgresDB")
	"""
	Delete a transaction by ID from the PostgresDB
	"""
	deleteTransactionByIdV2(inputs: DeleteTransactionByIdV2Input!): DeleteTransactionByIdV2Response!
	"""
	Update a spending item by ID
	"""
	updateSpendingItemById(inputs: UpdateSpendingItemByIdInput!): UpdateSpendingItemByIdResponse!
	"""
	Add a transaction
	"""
	addTransactionV2(inputs: AddTransactionV2Input!): AddTransactionResponseV2!
	"""
	Update a transaction by ID
	"""
	updateTransactionByIdV2(inputs: UpdateTransactionByIdV2Input!): UpdateTransactionByIdV2Response!
	"""
	Update the budget for a specific month
	"""
	updateMonthlyBudget(inputs: UpdateMonthlyBudgetInput!): MonthlyBudgetResponse! @deprecated(reason: "Do not use this handler anymore. Prefer the more finegrained updates instead")
	me(inputs: UpdateMe!): UpdateMeResponse!
}

