}

type AverageOverallRating {
	averageOverallRating: Float!
	ratingCount: Int!
	monthCount: Int!
	averageCollectionExperienceRating: Float!
	averageFoodQualityRating: Float!
	averageContentsVarietyRating: Float!
	averageFoodQuantityRating: Float!
}

type Country {
	isoCode: String!
	name: String!
}

type CoverPicture {
	pictureId: String!
	currentUrl: String!
	isAutomaticallyCreated: Boolean!
}

type Item {
	itemId: String!
	salesTaxes: [SalesTax!]!
	taxAmount: TaxAmount!
	priceExcludingTaxes: PriceExcludingTaxes!
	priceIncludingTaxes: PriceIncludingTaxes!
	valueExcludingTaxes: ValueExcludingTaxes!
	valueIncludingTaxes: ValueIncludingTaxes!
	taxationPolicy: String!
	showSalesTaxes: Boolean!
	itemPrice: ItemPrice!
	itemValue: ItemValue!
	coverPicture: CoverPicture!
	logoPicture: LogoPicture!
	name: String!
