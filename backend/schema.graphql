}

type ItemPrice {
	code: String!
	minorUnits: Int!
	decimals: Int!
}

type ItemTag {
	id: String!
	shortText: String!
	longText: String
	variant: String!
	description: String
	descriptionHeading: String
}

type ItemValue {
	code: String!
	minorUnits: Int!
	decimals: Int!
}

type Items {
	item: Item!
	store: Store!
	displayName: String!
	pickupInterval: PickupInterval!
	pickupLocation: PickupLocation!
	purchaseEnd: String!
	itemsAvailable: Int!
	distance: Float!
	favorite: Boolean!
	subscribedToNotification: Boolean!
	inSalesWindow: Boolean!
	newItem: Boolean!
	itemType: String!
	matchesFilters: Boolean!
	itemTags: [ItemTag!]!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type Location {
	longitude: Float!
	latitude: Float!
}

type LogoPicture {
	pictureId: String!
	currentUrl: String!
	isAutomaticallyCreated: Boolean!
}

type PickupInterval {
	end: String!
	start: String!
}

type PickupLocation {
	address: Address!
	location: Location!
}

type PriceExcludingTaxes {
	code: String!
	minorUnits: Int!
	decimals: Int!
}

type PriceIncludingTaxes {
	code: String!
	minorUnits: Int!
	decimals: Int!
}

type Query {
	tgtg: Tgtg!
}

type SalesTax {
	taxDescription: String!
	taxPercentage: Float!
}

type Store {
	storeId: String!
	storeName: String!
	branch: String!
	description: String!
	taxIdentifier: String!
	website: String!
	storeLocation: StoreLocation!
	logoPicture: LogoPicture!
	storeTimeZone: String!
	hidden: Boolean!
	favoriteCount: Int!
	distance: Float!
	coverPicture: CoverPicture!
