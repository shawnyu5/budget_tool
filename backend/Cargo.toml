[package]
name = "backend"
version = "1.2.1"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
schemars = "0.8.21"
simd-json = "0.14.3"
toml = "0.8.19"
tower = "0.5.1"
tracing = "0.1.41"
mongodb = "3.1.0"
dotenvy = "0.15.7"
thiserror = "2.0.12"
rayon = "1.10.0"
jwt = "0.16.0"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
utoipa = "5.2.0"
utoipa-axum = "0.2.0"
csv = "1.3.1"

[dependencies.axum]
version = "0.8.4"
features = ["macros"]

[dependencies.serde]
version = "1.0.215"
features = ["derive"]

[dependencies.tokio]
version = "1.42.0"
features = ["full"]

[dependencies.tower-http]
version = "0.6.2"
features = ["cors", "trace"]

[dependencies.tracing-subscriber]
version = "0.3.19"
features = ["env-filter", "std", "fmt"]

[dependencies.common-axum]
# path = "/home/shawny/common-axum/"
git = "https://github.com/shawnyu5/common-axum"
rev = "v1.4.1"


[dependencies.chrono]
version = "0.4.38"
features = ["serde"]
